# Copy to config.yaml (gitignored) and make it yours.

reader:
  name: "Alex"
  language: "English"        # the language the paper is written in

# What you want from your morning paper, in your own words. Claude designs
# the paper around this, keeps the layout until you change it, and builds
# learning from day to day. Be as specific as you like: interests, goals,
# levels, tone, what to leave out.
wishes: |
  Keep me informed about world news and science, without the doom.
  Teach me one interesting thing every day.
  Help me grow my English vocabulary, with regular review.
  End with something to think or write about.

# Optional inputs.
sources:
  # Newsletters from your inbox (needs the Gmail connector). A Gmail search.
  # newsletters:
  #   query: "from:(news@example.com OR hello@example.org)"
  #   lookback_days: 2
  # Today's meetings on the front page (needs the Google Calendar connector).
  # calendar:
  #   calendars: ["primary"]
  # Today's Hacker News front page (no account needed).
  # hackernews:
  #   top: 30
  # Today's forecast in a strip under the masthead (Open-Meteo, no account needed).
  # Set latitude/longitude too if the place name is ambiguous.
  # weather:
  #   place: "Berlin"
  # Personal emails that need a reply or have a deadline (Gmail connector).
  # Only actions are printed, never sensitive details.
  # inbox:
  #   query: "in:inbox -category:promotions -category:social -category:updates newer_than:2d"
  #   max: 5
  # RSS/Atom feeds to check for news, e.g. company blogs for launches.
  # feeds:
  #   - {name: "OpenAI", url: "https://openai.com/news/rss.xml"}
  #   - {name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml"}
  #   - {name: "Hugging Face", url: "https://huggingface.co/blog/feed.xml"}

# The footer shows the model, tokens and cost of each run, priced at Anthropic
# API list prices (built in for current models). Override or add prices,
# in USD per million tokens [input, output, cache read]:
# cost:
#   prices:
#     claude-opus-5-5: [4.00, 20.00, 0.20]

paper:
  pages: 2                   # 2 = one double-sided sheet
  # fact_topics: [history, science, space]   # areas for a "fact of the day", if your wishes ask for one

delivery:
  # lp    – print on a local printer (computer on, same network)
  # none  – only save the PDF in out/ (nothing is printed or sent)
  # email – (experimental) email a compact one-page PDF, e.g. to a printer's email address
  mode: "lp"
  printer: ""                # name from `lpstat -p`; empty = system default
  duplex: true
  email_to: []               # email mode; sender/password come from SMTP_* env vars
