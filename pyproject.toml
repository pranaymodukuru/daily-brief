[project]
name = "daily-brief"
version = "0.1.0"
description = "A personal printed morning paper with daily communication practice, written by Claude"
readme = "README.md"
authors = [
    { name = "pranaymodukuru", email = "pranaymns@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "weasyprint>=70.0",
]

[project.scripts]
daily-brief = "daily_brief:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
